[project]
name = "magpie"
version = "1.0.0"
description = "API server for reata.github.io"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "a2wsgi>=1.10.10,<2.0.0",
    "async-lru>=2.3.0,<3.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "httpx>=0.23.0,<1.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "sqllineage>=1.5.9,<2.0.0",
    "uvicorn>=0.52.4,<1.0.0",
]

[project.scripts]
dev = "magpie.main:dev"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv]
add-bounds = "major"

[tool.ruff]
target-version = "py314"
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["magpie"]

[tool.ty.environment]
python-version = "3.14"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
