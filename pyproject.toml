[project]
name = "magpie"
version = "1.0.0"
description = "API server for reata.github.io"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "httpx>=0.23.0,<1.0.0",
    "pandas>=3.0.5,<4.0.0",
    "numpy>=2.3.2,<3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "sqllineage>=1.5.4,<2.0.0",
    "uvicorn>=0.52.4,<1.0.0",
]

[project.scripts]
dev = "magpie.main:dev"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3,<3.0.0",
    "ruff>=0.16.3",
    "pytest>=9.1.1",
]

[tool.uv]
add-bounds = "major"

[tool.ruff]
target-version = "py314"
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["magpie"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
